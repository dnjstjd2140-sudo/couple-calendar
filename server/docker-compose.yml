# 로컬 개발용 DB. server 폴더에서: docker compose up -d  (끌 때: docker compose stop)
# Docker 를 켤 때 자동으로 같이 켜지지 않도록 restart: "no"
services:
  db:
    image: postgres:17
    container_name: couplecal-db
    restart: "no"
    environment:
      POSTGRES_DB: couplecal
      POSTGRES_USER: couplecal
      POSTGRES_PASSWORD: couplecal
    ports:
      - "5433:5432"
    volumes:
      - couplecal-db-data:/var/lib/postgresql/data

volumes:
  couplecal-db-data:
